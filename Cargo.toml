[package]
name = "camera-man"
version = "0.1.0"
edition = "2024"
default-run = "camera-man"

[lib]
name = "camera_man"
path = "src/lib.rs"

[[bin]]
name = "camera-man"
path = "src/main.rs"

[[bin]]
name = "cameraman-extension"
path = "src/extension_main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native"] }
plist = "1.8.0"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-media-io = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSUUID", "NSValue"] }
objc2-system-extensions = "0.3.2"
dispatch2 = "0.3.1"

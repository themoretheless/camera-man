name: Rust maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 2"

permissions:
  contents: read

jobs:
  unused-dependencies:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned nightly and cargo-udeps
        run: |
          rustup toolchain install nightly-2026-07-17 --profile minimal
          cargo +nightly-2026-07-17 install --locked cargo-udeps --version 0.1.61
      - name: Find unused dependencies on the supported udeps toolchain
        run: cargo +nightly-2026-07-17 udeps --locked --all-targets --all-features

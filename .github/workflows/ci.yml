name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Fuzz package
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: CLI smoke
        run: |
          cargo run --locked -- status
          cargo run --locked -- check
          cargo run --locked -- version
          cargo run --locked -- diagnose-extension
          cargo run --locked -- bundle --help
      - name: Bundle smoke
        run: |
          cargo run --locked --release -- bundle
          plutil -lint target/CameraMan.app/Contents/Info.plist
          plutil -lint target/CameraMan.app/Contents/Library/SystemExtensions/com.cameraman.rust.extension.systemextension/Contents/Info.plist
          plutil -extract NSSystemExtensionUsageDescription raw target/CameraMan.app/Contents/Library/SystemExtensions/com.cameraman.rust.extension.systemextension/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 target/CameraMan.app
      - name: Visual fixtures
        run: scripts/capture-ui-fixtures.sh
      - name: Upload visual fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-fixtures
          path: target/ui-fixtures
          if-no-files-found: error

  supply-chain:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: 1.97.1
          tools: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Dependency policy
        run: cargo deny check --hide-inclusion-graph
      - name: RustSec
        run: cargo audit
      - name: Future compatibility exceptions
        run: scripts/verify-future-incompat.sh

  feature-matrix:
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust, target, and cargo-hack
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: 1.97.1
          targets: ${{ matrix.target }}
          tools: cargo-hack@0.6.45
      - name: Meaningful feature powersets
        run: |
          cargo hack check --locked --target "${{ matrix.target }}" --no-default-features
          cargo hack check --locked --target "${{ matrix.target }}" \
            --feature-powerset --depth 2 --exclude-features all-experiments

  coverage:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust and coverage tool
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: 1.97.1
          components: llvm-tools-preview
          tools: cargo-llvm-cov@0.8.7
      - name: Combine clean library, app, extension, integration, and process coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --all-features --no-report --lib
          cargo llvm-cov --locked --all-features --no-report --bins
          cargo llvm-cov --locked --all-features --no-report --tests
          cargo llvm-cov report --lcov --output-path target/coverage.lcov
      - name: Upload combined coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined-rust-coverage
          path: target/coverage.lcov
          if-no-files-found: error

name: Production release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarized-app:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CAMERAMAN_PROVISIONING_PROFILE_BASE64: ${{ secrets.CAMERAMAN_PROVISIONING_PROFILE_BASE64 }}
          CAMERAMAN_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.CAMERAMAN_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          CAMERAMAN_APP_GROUP: ${{ secrets.CAMERAMAN_APP_GROUP }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.2" || {
            echo "release requires Xcode 16.2" >&2
            exit 1
          }
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2" || {
            echo "release requires the macOS 15.2 SDK" >&2
            exit 1
          }
          for name in CODESIGN_IDENTITY BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
            CAMERAMAN_PROVISIONING_PROFILE_BASE64 \
            CAMERAMAN_EXTENSION_PROVISIONING_PROFILE_BASE64 \
            CAMERAMAN_APP_GROUP APPLE_API_KEY_BASE64 APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            test -n "${!name:-}" || { echo "missing release secret: ${name}" >&2; exit 1; }
          done
          [[ "${CODESIGN_IDENTITY}" == "Developer ID Application:"* ]] || {
            echo "CODESIGN_IDENTITY must be a Developer ID Application identity" >&2
            exit 1
          }

      - name: Install Rust and pinned release tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-auditable --version 0.7.5
          cargo install --locked cargo-sbom --version 0.10.0
          cargo install --locked --features cli cargo-about --version 0.9.1
          cargo install --locked cargo-semver-checks --version 0.48.0

      - name: Create temporary signing keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CAMERAMAN_PROVISIONING_PROFILE_BASE64: ${{ secrets.CAMERAMAN_PROVISIONING_PROFILE_BASE64 }}
          CAMERAMAN_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.CAMERAMAN_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/cameraman-signing.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/cameraman-release.p12"
          APP_PROFILE_PATH="${RUNNER_TEMP}/CameraMan.provisionprofile"
          EXTENSION_PROFILE_PATH="${RUNNER_TEMP}/CameraManExtension.provisionprofile"
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"

          {
            echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "CERTIFICATE_PATH=${CERTIFICATE_PATH}"
            echo "CAMERAMAN_PROVISIONING_PROFILE=${APP_PROFILE_PATH}"
            echo "CAMERAMAN_EXTENSION_PROVISIONING_PROFILE=${EXTENSION_PROFILE_PATH}"
            echo "APPLE_API_KEY_PATH=${API_KEY_PATH}"
          } >> "${GITHUB_ENV}"

          printf '%s' "${BUILD_CERTIFICATE_BASE64}" | /usr/bin/base64 -D > "${CERTIFICATE_PATH}"
          printf '%s' "${CAMERAMAN_PROVISIONING_PROFILE_BASE64}" | /usr/bin/base64 -D > "${APP_PROFILE_PATH}"
          printf '%s' "${CAMERAMAN_EXTENSION_PROVISIONING_PROFILE_BASE64}" | /usr/bin/base64 -D > "${EXTENSION_PROFILE_PATH}"
          printf '%s' "${APPLE_API_KEY_BASE64}" | /usr/bin/base64 -D > "${API_KEY_PATH}"
          chmod 600 "${CERTIFICATE_PATH}" "${APP_PROFILE_PATH}" "${EXTENSION_PROFILE_PATH}" "${API_KEY_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${P12_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Release dependency gates
        run: |
          cargo deny check --hide-inclusion-graph
          cargo audit

      - name: Public Rust API semver gate
        run: scripts/verify-semver.sh

      - name: Record reproducible build inputs
        run: |
          echo "CAMERAMAN_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Build and compare unsigned auditable binaries
        run: scripts/build-reproducible-release.sh

      - name: Bundle and sign the reproduced application
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          CAMERAMAN_APP_GROUP: ${{ secrets.CAMERAMAN_APP_GROUP }}
          CAMERAMAN_PREBUILT_EXTENSION: ${{ github.workspace }}/target/reproducibility/first/release/cameraman-extension
        run: target/reproducibility/first/release/camera-man bundle

      - name: Verify signatures and entitlements
        env:
          CAMERAMAN_APP_GROUP: ${{ secrets.CAMERAMAN_APP_GROUP }}
        run: |
          codesign --verify --deep --strict --verbose=2 target/CameraMan.app
          scripts/verify-release-entitlements.sh target/CameraMan.app

      - name: Generate notices and SPDX 3.0.1 SBOM
        run: |
          python3 -m venv "${RUNNER_TEMP}/spdx-tools"
          "${RUNNER_TEMP}/spdx-tools/bin/python" -m pip install -r scripts/requirements-sbom.txt
          scripts/generate-third-party-notices.sh
          PYTHON="${RUNNER_TEMP}/spdx-tools/bin/python" scripts/generate-sbom.sh

      - name: Notarize, staple, assess, and archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/notarize-release.sh

      - name: Install verified OSV-Scanner
        run: |
          scripts/install-osv-scanner.sh "${RUNNER_TEMP}/osv-scanner"
          echo "OSV_SCANNER=${RUNNER_TEMP}/osv-scanner" >> "${GITHUB_ENV}"

      - name: Scan final archive binaries and SBOM
        run: scripts/audit-release-artifacts.sh

      - name: Generate release manifest
        run: |
          cargo build --locked --release --bin cameraman-release-manifest
          target/release/cameraman-release-manifest \
            target/release-artifacts \
            target/CameraMan.app

      - name: Attest final nested binaries
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            target/CameraMan.app/Contents/MacOS/CameraMan
            target/CameraMan.app/Contents/Library/SystemExtensions/com.cameraman.rust.extension.systemextension/Contents/MacOS/CameraManExtension

      - name: Attest published SBOMs
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            target/release-artifacts/camera-man.spdx.json
            target/release-artifacts/camera-man.spdx3.jsonld

      - name: Attest release evidence and archive
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            target/release-artifacts/CameraMan.zip
            target/release-artifacts/CameraMan.zip.sha256
            target/release-artifacts/release-manifest.json
            target/release-artifacts/notary-result.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CameraMan-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            target/release-artifacts/CameraMan.zip
            target/release-artifacts/CameraMan.zip.sha256
            target/release-artifacts/camera-man.spdx.json
            target/release-artifacts/camera-man.spdx3.jsonld
            target/release-artifacts/release-manifest.json
            target/release-artifacts/notary-result.json
            target/release-artifacts/archive-entries.txt
            target/release-artifacts/binary-audit.txt
            target/release-artifacts/sbom-osv.json
            target/reproducibility/unsigned-binaries.sha256
            THIRD_PARTY_NOTICES.md

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
          rm -f "${CERTIFICATE_PATH:-}" \
            "${CAMERAMAN_PROVISIONING_PROFILE:-}" \
            "${CAMERAMAN_EXTENSION_PROVISIONING_PROFILE:-}" \
            "${APPLE_API_KEY_PATH:-}"
